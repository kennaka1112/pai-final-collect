# ACT の学習設定（集めるタスク）
#   17秒・約345フレームの長い軌道を2段構えで再現する必要があるため、
#   1個押しのタスク（6000 step）より step 数を増やしている。
dataset_root: "/home/ubuntu/dataset/lerobot_dataset/crane_plus_collect"
repo_id: "crane_plus_collect"
output_directory: "/home/ubuntu/checkpoints/train/crane_plus_collect_act"
config_path: "configs/collect_features.py"

device: "cuda"
training_steps: 9000
log_freq: 100
num_workers: 2
batch_size: 16
chunk_size: 32
n_action_steps: 8
learning_rate: 0.0001
delta_timestamps:
  observation.environment_state: [0.0]
  observation.state: [0.0]
  action: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55,
           0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0, 1.05, 1.1, 1.15,
           1.2, 1.25, 1.3, 1.35, 1.4, 1.45, 1.5, 1.55]
